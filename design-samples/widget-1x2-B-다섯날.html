<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>1×2 위젯 B — 앞으로 5일</title>
<style>

  <div class="r a"><small>26 목</small>주</div>

  <div class="r c"><small>28 토</small>비</div>
