<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>아이콘 C — 날짜 숫자</title>
<style>
body{margin:0;background:#dfe6ec;font-family:"Noto Sans KR",sans-serif;display:flex;flex-direction:column;align-items:center;gap:18px;padding:28px}
h2{margin:0;font-size:18px;color:#17212b}
.icon{width:192px;height:192px;border-radius:44px;background:#eef3f7;position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center}
.icon .day{font-size:96px;font-weight:900;color:#1f5f7a;line-height:1;letter-spacing:-4px}
.bars{position:absolute;left:24px;right:24px;bottom:22px;display:flex;gap:6px}
.bars i{flex:1;height:12px;border-radius:6px}
.small{width:96px;height:96px;border-radius:22px;background:#eef3f7;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.small .day{font-size:44px;font-weight:900;color:#1f5f7a;letter-spacing:-2px}
.small .bars{left:12px;right:12px;bottom:10px;gap:3px}
.small .bars i{height:6px;border-radius:3px}
.row{display:flex;gap:10px;align-items:flex-end}
p{margin:0;font-size:13px;color:#566676}
</style></head><body>
<h2>아이콘 C — 오늘 날짜 숫자 + 근무 색 막대</h2>
<div class="icon">
  <div class="day">11</div>
  <div class="bars"><i style="background:#3f7d5c"></i><i style="background:#33517e"></i><i style="background:#8a6bb0"></i><i style="background:#9a938a"></i></div>
</div>
<div class="row">
  <div class="small"><div class="day">11</div><div class="bars"><i style="background:#3f7d5c"></i><i style="background:#33517e"></i><i style="background:#8a6bb0"></i><i style="background:#9a938a"></i></div></div>
  <p>홈 화면 크기 미리보기</p>
</div>
</body></html>
