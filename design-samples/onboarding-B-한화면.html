<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>처음 시작 B — 한 화면</title>
<style>
:root{--ink:#17212b;--ink-soft:#566676;--paper:#eef3f7;--card:#fff;--line:#d8e1e8;--accent:#1f5f7a;--on-accent:#fff;--shadow:0 1px 2px rgba(23,33,43,.06),0 6px 16px rgba(23,33,43,.06)}
*{box-sizing:border-box}body{margin:0;background:#cfd8e0;font-family:"Noto Sans KR",sans-serif;color:var(--ink)}
.phone{width:375px;height:812px;margin:20px auto;background:var(--paper);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.scroll{flex:1;overflow:auto;padding:22px 18px}
h1{font-size:22px;margin:0 0 4px;font-weight:900;letter-spacing:-.02em}
.sub{font-size:13px;color:var(--ink-soft);margin:0 0 16px}
.restore{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);border:1.5px solid var(--accent);margin-bottom:14px}
.restore b{display:block;font-size:15px;color:var(--accent)}.restore small{font-size:12px;color:var(--ink-soft)}
.restore button{margin-top:10px;width:100%;border:none;border-radius:11px;padding:12px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:14px}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--ink-soft);font-weight:700}
.chips{display:flex;gap:6px}.chips span{flex:1;text-align:center;padding:9px 0;border-radius:10px;border:1.5px solid var(--line);font-size:13px;font-weight:700}
.chips span.sel{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px}
input{width:90px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:14px;background:var(--paper)}
.foot{padding:12px 18px 24px;background:var(--paper)}
.foot button{width:100%;border:none;border-radius:13px;padding:15px;background:var(--accent);color:var(--on-accent);font-weight:900;font-size:16px}
</style></head><body>
<div class="phone">
  <div class="scroll">
    <h1>교대달력 시작하기</h1>
    <p class="sub">아래 내용을 한 번에 채우면 바로 시작해요.</p>
    <div class="restore"><b>백업 파일이 있나요?</b><small>가지고 있던 백업을 불러오면 기록이 그대로 옮겨져요.</small><button>백업 파일 불러오기</button></div>
    <div class="card"><h3>근무 패턴</h3><div class="chips"><span class="sel">4조 2교대</span><span>일근</span></div></div>
    <div class="card"><h3>내 반</h3><div class="chips"><span>A반</span><span class="sel">B반</span><span>C반</span><span>D반</span></div></div>
    <div class="card"><h3>기준 근무 (오늘 무슨 근무인지)</h3>
      <div class="row"><span>기준 날짜</span><input value="2026-09-23"></div>
      <div class="row"><span>그날 내 근무</span><input value="비번"></div></div>
    <div class="card"><h3>연차</h3>
      <div class="row"><span>연차 총 일수</span><input value="15"></div>
      <div class="row"><span>촉진연차 개수</span><input value="8"></div></div>
  </div>
  <div class="foot"><button>시작하기</button></div>
</div>
</body></html>
