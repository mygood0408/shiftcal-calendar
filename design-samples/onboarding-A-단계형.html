<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>처음 시작 A — 단계형</title>
<style>
:root{--ink:#17212b;--ink-soft:#566676;--paper:#eef3f7;--card:#fff;--line:#d8e1e8;--accent:#1f5f7a;--on-accent:#fff;--shadow:0 1px 2px rgba(23,33,43,.06),0 6px 16px rgba(23,33,43,.06)}
*{box-sizing:border-box}body{margin:0;background:#cfd8e0;font-family:"Noto Sans KR",sans-serif;color:var(--ink)}
.phone{width:375px;height:812px;margin:20px auto;background:var(--paper);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.top{padding:22px 20px 0}
.label{font-size:12px;color:var(--accent);font-weight:700}
.bar{display:flex;gap:6px;margin:10px 0 18px}.bar i{flex:1;height:5px;border-radius:9px;background:var(--line)}.bar i.on{background:var(--accent)}
h1{font-size:22px;margin:0 0 6px;font-weight:900;letter-spacing:-.02em}
p.sub{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.5}
.body{padding:18px 20px;flex:1;display:flex;flex-direction:column;gap:10px}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:15px;font-weight:700;box-shadow:var(--shadow)}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt small{display:block;font-size:12px;font-weight:500;color:var(--ink-soft);margin-top:4px}
.chips{display:flex;gap:8px}.chips span{flex:1;text-align:center;padding:10px 0;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:14px}
.chips span.sel{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.foot{padding:14px 20px 26px;display:flex;gap:8px;background:var(--paper)}
.btn{flex:1;border:none;border-radius:12px;padding:14px 0;font-weight:700;font-size:15px;background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn.p{background:var(--accent);color:var(--on-accent)}
.restore{margin-top:4px;border:1.5px dashed var(--accent);background:#fff;color:var(--accent);border-radius:12px;padding:12px;font-weight:700;font-size:14px;text-align:center}
</style></head><body>
<div class="phone">
  <div class="top">
    <div class="label">처음 설정 · 1 / 3</div>
    <div class="bar"><i class="on"></i><i></i><i></i></div>
    <h1>어떤 근무를 하세요?</h1>
    <p class="sub">근무 패턴에 맞춰 달력을 채워 드릴게요. 나중에 설정에서 바꿀 수 있어요.</p>
  </div>
  <div class="body">
    <div class="opt sel">4조 2교대<small>주간 · 야간 · 비번 · 휴무가 4일 주기로 돌아가요</small></div>
    <div class="opt">일근<small>평일 주간, 토·일·공휴일 휴무</small></div>
    <div class="restore">📂 백업 파일이 있으면 여기서 불러오기</div>
  </div>
  <div class="foot"><button class="btn">이전</button><button class="btn p">다음</button></div>
</div>
</body></html>
