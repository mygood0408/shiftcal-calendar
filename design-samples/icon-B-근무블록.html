<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>아이콘 B — 근무 4색 블록</title>
<style>
body{margin:0;background:#dfe6ec;font-family:"Noto Sans KR",sans-serif;display:flex;flex-direction:column;align-items:center;gap:18px;padding:28px}
h2{margin:0;font-size:18px;color:#17212b}
.icon{width:192px;height:192px;border-radius:44px;overflow:hidden;position:relative;box-shadow:0 8px 20px rgba(0,0,0,.2);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.icon div{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px}
.a{background:#3f7d5c}.b{background:#33517e}.c{background:#8a6bb0}.d{background:#9a938a}
.tag{position:absolute;left:0;right:0;bottom:0;height:0}
.small{width:96px;height:96px;border-radius:22px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.small div{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:11px}
.row{display:flex;gap:10px;align-items:flex-end}
p{margin:0;font-size:13px;color:#566676}
</style></head><body>
<h2>아이콘 B — 근무 4색 블록 (주간·야간·비번·휴무)</h2>
<div class="icon">
  <div class="a">주</div><div class="b">야</div>
  <div class="c">비</div><div class="d">휴</div>
</div>
<div class="row">
  <div class="small"><div class="a">주</div><div class="b">야</div><div class="c">비</div><div class="d">휴</div></div>
  <p>홈 화면 크기 미리보기</p>
</div>
</body></html>
