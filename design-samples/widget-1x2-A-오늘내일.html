<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>1×2 위젯 A — 오늘·내일</title>
<style>
body{margin:0;background:#dfe6ec;font-family:"Noto Sans KR",sans-serif;display:flex;flex-direction:column;align-items:center;gap:16px;padding:28px;color:#17212b}
h2{margin:0;font-size:18px}p{margin:0;font-size:13px;color:#566676;text-align:center}
/* 1x2 위젯: 가로 1칸, 세로 2칸 */
.w{width:160px;height:330px;border-radius:24px;background:#eef3f7;box-shadow:0 8px 20px rgba(0,0,0,.18);padding:14px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
.today{flex:1.4;border-radius:18px;background:#3f7d5c;color:#fff;padding:12px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
.today small{font-size:12px;font-weight:700;opacity:.9}
.today b{font-size:30px;font-weight:900;line-height:1}
.today span{font-size:14px;font-weight:700}
.tom{flex:1;border-radius:18px;background:#fff;padding:12px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
.tom small{font-size:12px;color:#566676;font-weight:700}
.tom b{font-size:22px;font-weight:900;color:#33517e}
</style></head><body>
<h2>1×2 위젯 A — 오늘·내일 (세로)</h2>
<div class="w">
  <div class="today"><small>11/26 목</small><b>주간</b><span>08:00 출근</span></div>
  <div class="tom"><small>11/27 금</small><b>야간</b></div>
</div>
<p>오늘을 크게, 내일을 작게. 가장 단순함.</p>
</body></html>
